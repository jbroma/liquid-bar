name: Bug report
description: Something in the bar looks or behaves wrong
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: And how to make it happen again. A screenshot helps.
    validations:
      required: true
  - type: input
    attributes:
      label: LiquidBar and macOS version
      placeholder: LiquidBar 0.15.0, macOS 26.1
    validations:
      required: true

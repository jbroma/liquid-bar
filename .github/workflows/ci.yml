name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request's newer push cancels its older run. Every commit on main keeps its own run, so none shows as cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: swift test
      # The release configuration is what `make app` ships.
      - run: swift build -c release

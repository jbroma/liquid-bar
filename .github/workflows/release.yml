# The second half of `make release`. The Mac builds, notarizes, and uploads the zip to a draft release, because only it
# holds the Developer ID and the Sparkle key. This writes the notes, publishes the release, and then adds it to
# CHANGELOG.md and appcast.xml, so the update feed never points to a zip that is not public yet.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, like v0.11.0
        required: true
      enclosure:
        description: What sign_update printed for the zip
        required: true

permissions:
  contents: write

concurrency: release

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      ENCLOSURE: ${{ inputs.enclosure }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Check that the tag is main's latest
        run: test "$(git describe --tags --abbrev=0 --match 'v*')" = "$TAG"
      - run: pipx install git-cliff==2.14.2
      - name: Write the notes and the changelog
        run: |
          git-cliff --latest --strip all --output notes.md
          git-cliff --output CHANGELOG.md
      - name: Publish the release
        run: gh release edit "$TAG" --notes-file notes.md --draft=false --latest
      - name: Add it to the appcast
        run: python3 scripts/appcast.py "$TAG" "$ENCLOSURE" notes.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md appcast.xml
          git commit --message "chore: changelog and appcast for $TAG"
          git push origin HEAD:main
